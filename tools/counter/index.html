<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字数カウンター</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #667085;
    --border: #d0d5dd;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a;
      --card: #1c1f27;
      --text: #e8eaf0;
      --muted: #98a2b3;
      --border: #3a3f4b;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  textarea {
    display: block;
    width: 100%;
    min-height: 220px;
    padding: 12px;
    font: inherit;
    font-size: 16px; /* iOSの自動ズーム防止 */
    line-height: 1.6;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .stats { margin: 12px 0; display: grid; gap: 8px; }
  .stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .stat span { color: var(--muted); }
  .stat strong { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  button {
    width: 100%;
    padding: 12px;
    font: inherit;
    font-size: 16px;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <h1>文字数カウンター</h1>
  <textarea id="text" placeholder="ここに文章を入力または貼り付け" aria-label="カウントする文章"></textarea>
  <div class="stats" aria-live="polite">
    <div class="stat"><span>文字数</span><strong id="total">0</strong></div>
    <div class="stat"><span>空白を除いた文字数</span><strong id="nospace">0</strong></div>
    <div class="stat"><span>行数</span><strong id="lines">0</strong></div>
  </div>
  <button type="button" id="clear">クリア</button>
</main>
<script>
  var text = document.getElementById('text');
  var total = document.getElementById('total');
  var nospace = document.getElementById('nospace');
  var lines = document.getElementById('lines');

  function update() {
    var v = text.value;
    total.textContent = Array.from(v).length;
    // 半角・全角スペース、タブ、改行を除外
    nospace.textContent = Array.from(v.replace(/[\s　]/g, '')).length;
    lines.textContent = v === '' ? 0 : v.split(/\r\n|\r|\n/).length;
  }

  text.addEventListener('input', update);
  document.getElementById('clear').addEventListener('click', function () {
    text.value = '';
    update();
    text.focus();
  });
  update();
</script>
</body>
</html>
