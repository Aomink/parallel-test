<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>色変換ツール</title>
<style>
:root{--bg:#f5f6f8;--fg:#1c1e21;--card:#fff;--bd:#c9ced6;--ac:#2563eb;--err:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#eceef1;--card:#22252a;--bd:#454a52;--ac:#6ea0ff;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.4rem;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{font-weight:600}
.row{display:flex;gap:8px}
input{font:inherit;font-size:1.1rem;min-height:48px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
input:focus{outline:2px solid var(--ac)}
input[aria-invalid="true"]{border-color:var(--err)}
button{font:inherit;min-height:48px;min-width:88px;padding:0 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
.rgb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rgb div{display:flex;flex-direction:column;gap:4px}
.msg{min-height:1.5em;color:var(--err);font-size:.95rem;margin:0}
#preview{height:120px;border-radius:12px;border:1px solid var(--bd);background:#000}
</style>
</head>
<body>
<main>
<h1>色変換ツール（HEX ⇔ RGB）</h1>
<div id="preview" aria-label="色のプレビュー"></div>
<section class="card">
<label for="hex">HEX（例: #ff8800 / f80）</label>
<div class="row"><input id="hex" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="#000000"><button id="cphex" type="button">コピー</button></div>
<p class="msg" id="hexmsg" role="alert"></p>
</section>
<section class="card">
<label>RGB（0〜255）</label>
<div class="rgb">
<div><label for="r">R</label><input id="r" type="text" inputmode="numeric" value="0"></div>
<div><label for="g">G</label><input id="g" type="text" inputmode="numeric" value="0"></div>
<div><label for="b">B</label><input id="b" type="text" inputmode="numeric" value="0"></div>
</div>
<button id="cprgb" type="button">rgb() をコピー</button>
<p class="msg" id="rgbmsg" role="alert"></p>
</section>
</main>
<script>
function parseHex(s){
  s=String(s).trim().replace(/^#/,'');
  if(/^[0-9a-fA-F]{3}$/.test(s)) s=s.replace(/./g,function(c){return c+c});
  if(!/^[0-9a-fA-F]{6}$/.test(s)) return null;
  return [0,2,4].map(function(i){return parseInt(s.substr(i,2),16)});
}
function toHex(r,g,b){
  return '#'+[r,g,b].map(function(n){return ('0'+n.toString(16)).slice(-2)}).join('');
}
function parseRgb(vals){
  var out=[];
  for(var i=0;i<vals.length;i++){
    var v=String(vals[i]).trim();
    if(!/^\d{1,3}$/.test(v)) return null;
    var n=parseInt(v,10);
    if(n>255) return null;
    out.push(n);
  }
  return out;
}
if(typeof document!=='undefined'){
var $=function(id){return document.getElementById(id)};
var hex=$('hex'),R=$('r'),G=$('g'),B=$('b');
function preview(rgb){$('preview').style.background=toHex(rgb[0],rgb[1],rgb[2])}
function mark(el,bad){el.setAttribute('aria-invalid',bad?'true':'false')}
hex.addEventListener('input',function(){
  var rgb=parseHex(hex.value);
  if(!rgb){mark(hex,true);$('hexmsg').textContent='HEXが不正です。3桁または6桁の16進数で入力してください（例: #ff8800）。';return}
  mark(hex,false);$('hexmsg').textContent='';$('rgbmsg').textContent='';
  [R,G,B].forEach(function(e,i){e.value=rgb[i];mark(e,false)});
  preview(rgb);
});
function onRgb(){
  var rgb=parseRgb([R.value,G.value,B.value]);
  if(!rgb){
    [R,G,B].forEach(function(e){mark(e,parseRgb([e.value])===null)});
    $('rgbmsg').textContent='RGBは0〜255の整数で入力してください。';return}
  [R,G,B].forEach(function(e){mark(e,false)});
  $('rgbmsg').textContent='';$('hexmsg').textContent='';mark(hex,false);
  hex.value=toHex(rgb[0],rgb[1],rgb[2]);
  preview(rgb);
}
[R,G,B].forEach(function(e){e.addEventListener('input',onRgb)});
function copy(t){try{var p=navigator.clipboard&&navigator.clipboard.writeText(t);if(p&&p.catch)p.catch(function(){})}catch(e){}}
$('cphex').addEventListener('click',function(){copy(hex.value)});
$('cprgb').addEventListener('click',function(){copy('rgb('+R.value+', '+G.value+', '+B.value+')')});
}
</script>
</body>
</html>
